<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0f172a;
    color: #e2e8f0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }
  h1 { letter-spacing: 6px; font-weight: 300; text-transform: uppercase; }
  #hud { display: flex; gap: 32px; font-size: 1.1rem; }
  #hud span b { color: #4ade80; }
  #wrap { position: relative; }
  canvas {
    background: #1e293b;
    border: 2px solid #334155;
    border-radius: 8px;
    display: block;
    max-width: 92vw;
    height: auto;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: rgba(15, 23, 42, 0.85);
    border-radius: 8px;
    text-align: center;
  }
  #overlay.hidden { display: none; }
  #overlay h2 { font-size: 2rem; color: #f87171; }
  #overlay p { color: #94a3b8; }
  button {
    background: #4ade80;
    border: none;
    color: #052e16;
    font-size: 1rem;
    font-weight: bold;
    padding: 10px 28px;
    border-radius: 999px;
    cursor: pointer;
    transition: transform .1s;
  }
  button:hover { transform: scale(1.05); }
  small { color: #64748b; }
</style>
</head>
<body>
  <h1>Snake</h1>
  <div id="hud">
    <span>Puntos: <b id="score">0</b></span>
    <span>Récord: <b id="best">0</b></span>
  </div>
  <div id="wrap">
    <canvas id="game" width="480" height="480"></canvas>
    <div id="overlay">
      <h2 id="msg">Snake</h2>
      <p id="sub">Usa las flechas o WASD para moverte</p>
      <button id="btn">Jugar</button>
    </div>
  </div>
  <small>Flechas / WASD para moverse &middot; Espacio o clic para reiniciar</small>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const GRID = 24;
const CELL = canvas.width / GRID;

let snake, dir, nextDir, food, score, best, speed, timer, state;

best = +(localStorage.getItem('snake-best') || 0);
document.getElementById('best').textContent = best;

function reset() {
  snake = [{x: 11, y: 12}, {x: 10, y: 12}, {x: 9, y: 12}];
  dir = {x: 1, y: 0};
  nextDir = dir;
  score = 0;
  speed = 130;
  placeFood();
  document.getElementById('score').textContent = score;
}

function placeFood() {
  do {
    food = {
      x: Math.floor(Math.random() * GRID),
      y: Math.floor(Math.random() * GRID)
    };
  } while (snake.some(s => s.x === food.x && s.y === food.y));
}

function step() {
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID ||
      snake.some(s => s.x === head.x && s.y === head.y)) {
    return gameOver();
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score += 10;
    document.getElementById('score').textContent = score;
    if (speed > 60) speed -= 2;
    placeFood();
    clearInterval(timer);
    timer = setInterval(step, speed);
  } else {
    snake.pop();
  }
  draw();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // cuadrícula sutil
  ctx.strokeStyle = 'rgba(51,65,85,.35)';
  for (let i = 1; i < GRID; i++) {
    ctx.beginPath(); ctx.moveTo(i*CELL, 0); ctx.lineTo(i*CELL, canvas.height); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i*CELL); ctx.lineTo(canvas.width, i*CELL); ctx.stroke();
  }

  // comida
  ctx.fillStyle = '#f87171';
  ctx.beginPath();
  ctx.arc(food.x*CELL + CELL/2, food.y*CELL + CELL/2, CELL/2 - 3, 0, Math.PI*2);
  ctx.fill();

  // serpiente
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? '#86efac' : '#4ade80';
    ctx.fillRect(s.x*CELL + 1, s.y*CELL + 1, CELL - 2, CELL - 2);
  });
}

function startGame() {
  reset();
  draw();
  document.getElementById('overlay').classList.add('hidden');
  clearInterval(timer);
  timer = setInterval(step, speed);
}

function gameOver() {
  clearInterval(timer);
  if (score > best) {
    best = score;
    localStorage.setItem('snake-best', best);
    document.getElementById('best').textContent = best;
    document.getElementById('msg').textContent = '¡Nuevo récord!';
  } else {
    document.getElementById('msg').textContent = 'Fin del juego';
  }
  document.getElementById('sub').textContent = 'Puntuación: ' + score;
  document.getElementById('btn').textContent = 'Reintentar';
  document.getElementById('overlay').classList.remove('hidden');
}

const KEYS = {
  ArrowUp: {x:0,y:-1}, w: {x:0,y:-1},
  ArrowDown: {x:0,y:1}, s: {x:0,y:1},
  ArrowLeft: {x:-1,y:0}, a: {x:-1,y:0},
  ArrowRight: {x:1,y:0}, d: {x:1,y:0}
};

addEventListener('keydown', e => {
  if (KEYS[e.key]) {
    e.preventDefault();
    const nd = KEYS[e.key];
    // evitar girar 180°
    if (nd.x !== -dir.x || nd.y !== -dir.y) nextDir = nd;
  }
  if ((e.key === ' ' || e.key === 'Enter') &&
      !document.getElementById('overlay').classList.contains('hidden')) {
    e.preventDefault();
    startGame();
  }
});

// soporte táctil (deslizar)
let tx, ty;
canvas.addEventListener('touchstart', e => {
  tx = e.touches[0].clientX; ty = e.touches[0].clientY;
}, {passive: true});
canvas.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx;
  const dy = e.changedTouches[0].clientY - ty;
  let nd;
  if (Math.abs(dx) > Math.abs(dy)) nd = dx > 0 ? KEYS.ArrowRight : KEYS.ArrowLeft;
  else nd = dy > 0 ? KEYS.ArrowDown : KEYS.ArrowUp;
  if (nd && (nd.x !== -dir.x || nd.y !== -dir.y)) nextDir = nd;
}, {passive: true});

document.getElementById('btn').addEventListener('click', startGame);

reset();
draw();
</script>
</body>
</html>
