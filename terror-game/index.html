<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NO MIRES ATRÁS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:Georgia,'Times New Roman',serif}
canvas{display:block;cursor:none}
.hidden{display:none!important}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;text-align:center;z-index:10;padding:20px}
#menu{background:radial-gradient(ellipse at center,#160709 0%,#000 75%)}
#end{background:rgba(0,0,0,.93)}
h1{font-size:clamp(42px,8vw,92px);letter-spacing:.18em;color:#a4161a;text-shadow:0 0 24px rgba(164,22,26,.55),0 0 60px rgba(120,0,0,.4);animation:fl 4s infinite;line-height:1.1}
@keyframes fl{0%,90%,100%{opacity:1}91%{opacity:.35}92%{opacity:1}95%{opacity:.55}96%{opacity:1}}
.hint{color:#9a8f8f;font-size:clamp(15px,2vw,20px);line-height:1.7;max-width:640px}
.controls{color:#5c5454;font-size:14px;letter-spacing:.12em;line-height:2}
button{font-family:inherit;font-size:clamp(16px,2vw,21px);letter-spacing:.14em;color:#d8cfcf;background:#180404;border:1px solid #a4161a;padding:14px 34px;cursor:pointer;transition:.25s}
button:hover{background:#2b0606;box-shadow:0 0 24px rgba(164,22,26,.45);color:#fff}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#pg{position:absolute;top:16px;left:18px;font-family:Consolas,monospace;font-size:19px;color:#8f8f8f;text-shadow:0 0 8px #000;letter-spacing:.08em}
#stamWrap{position:absolute;bottom:18px;left:18px;width:190px;height:9px;border:1px solid #3a3232;background:#0a0808}
#stam{height:100%;width:100%;background:#7fae6a;transition:background .3s}
#msg{position:fixed;top:16%;left:0;right:0;text-align:center;color:#c9bdbd;font-size:clamp(16px,2.2vw,23px);letter-spacing:.1em;text-shadow:0 0 14px #000,0 0 30px #000;opacity:0;transition:opacity .6s;z-index:6;pointer-events:none}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud" class="hidden"><span id="pg">Páginas 0 / 8</span><div id="stamWrap"><div id="stam"></div></div></div>
<div id="msg"></div>
<div class="screen" id="menu">
<h1>NO MIRES<br>ATRÁS</h1>
<p class="hint">Estás solo en el laberinto.<br>Recoge las <b>8 páginas</b> antes de que Él te encuentre…<br>y pase lo que pase, <b>no sostengas su mirada</b>.</p>
<div class="controls">WASD / FLECHAS — MOVERTE &nbsp;·&nbsp; SHIFT — CORRER</div>
<button id="btnStart">ENTRAR EN LA OSCURIDAD</button>
</div>
<div class="screen hidden" id="end">
<h1 id="endTitle">HAS MUERTO</h1>
<p class="hint" id="endReason"></p>
<button id="btnRetry">REINTENTAR</button>
</div>
<script>
const TILE=64,MW=25,MH=25,WORLD_W=MW*TILE,WORLD_H=MH*TILE;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let vw=0,vh=0;
function resize(){vw=cv.width=innerWidth;vh=cv.height=innerHeight}
addEventListener('resize',resize);resize();

const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const dist=(x1,y1,x2,y2)=>Math.hypot(x2-x1,y2-y1);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function rand2(x,y){const n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n)}

let grid=[],floorCells=[],distMap=[];
let player={x:0,y:0,r:13,stam:100,fx:1,fy:0,moving:false};
let ghost={x:0,y:0,active:false,timer:5,chasing:false,loseT:0};
let pages=[],door=null,pagesGot=0;
let keys={},state='menu',tG=0,jt=0,dieReason='';
let stare=0,danger=0,staticA=0,hbT=0,footT=0,msgTO=null;

function genMaze(){
grid=[];for(let y=0;y<MH;y++){grid.push(new Array(MW).fill(1))}
const stack=[[1,1]];grid[1][1]=0;
const dirs=[[2,0],[-2,0],[0,2],[0,-2]];
while(stack.length){
const [cx,cy]=stack[stack.length-1];
const opts=shuffle(dirs.slice()).filter(([dx,dy])=>{const nx=cx+dx,ny=cy+dy;return nx>0&&ny>0&&nx<MW-1&&ny<MH-1&&grid[ny][nx]===1});
if(opts.length){const [dx,dy]=opts[0];grid[cy+dy/2][cx+dx/2]=0;grid[cy+dy][cx+dx]=0;stack.push([cx+dx,cy+dy])}
else stack.pop();
}
for(let y=1;y<MH-1;y++)for(let x=1;x<MW-1;x++){
if(grid[y][x]===1&&((grid[y][x-1]===0&&grid[y][x+1]===0)||(grid[y-1][x]===0&&grid[y+1][x]===0))&&Math.random()<0.07)grid[y][x]=0;
}
floorCells=[];
for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)if(grid[y][x]===0)floorCells.push({x,y});
distMap=new Array(MH*MW).fill(-1);
const q=[[1,1]];distMap[1*MW+1]=0;
while(q.length){
const [cx,cy]=q.shift();
for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
const nx=cx+dx,ny=cy+dy;
if(nx>=0&&ny>=0&&nx<MW&&ny<MH&&grid[ny][nx]===0&&distMap[ny*MW+nx]<0){distMap[ny*MW+nx]=distMap[cy*MW+cx]+1;q.push([nx,ny])}
}
}
}
const cc=c=>({px:(c.x+.5)*TILE,py:(c.y+.5)*TILE});

function resetGame(){
genMaze();
player.x=1.5*TILE;player.y=1.5*TILE;player.stam=100;player.fx=1;player.fy=0;
pagesGot=0;stare=0;danger=0;staticA=0;jt=0;hbT=.4;footT=0;
door=null;pages=[];
let doorCell=floorCells[0],best=-1;
for(const c of floorCells){const d=distMap[c.y*MW+c.x];if(d>best){best=d;doorCell=c}}
const dc=cc(doorCell);door={x:dc.px,y:dc.py,active:false};
let far=floorCells.filter(c=>distMap[c.y*MW+c.x]>17);
if(!far.length)far=floorCells.filter(c=>distMap[c.y*MW+c.x]>10);
const g0=cc(far[(Math.random()*far.length)|0]);
ghost={x:g0.px,y:g0.py,active:false,timer:5,chasing:false,loseT:0};
const cand=shuffle(floorCells.filter(c=>distMap[c.y*MW+c.x]>8&&c!==doorCell));
let minGap=7;
while(pages.length<8&&minGap>=2){
for(const c of cand){
if(pages.length>=8)break;
if(pages.every(p=>Math.abs(p.cx-c.x)+Math.abs(p.cy-c.y)>=minGap)){
const p0=cc(c);pages.push({x:p0.px,y:p0.py,taken:false,cx:c.x,cy:c.y});
}
}
minGap-=2;
}
document.getElementById('pg').textContent='Páginas 0 / 8';
showMsg('Encuentra las 8 páginas…',3.2);
}

const tileSolid=(px,py)=>{
const x=Math.floor(px/TILE),y=Math.floor(py/TILE);
return x<0||y<0||x>=MW||y>=MH||grid[y][x]===1;
};
function canBe(px,py,r){
for(let yy=py-r;yy<=py+r;yy+=r)for(let xx=px-r;xx<=px+r;xx+=r)
if(tileSolid(Math.min(xx,px+r*0.99),Math.min(yy,py+r*0.99)))return false;
return !tileSolid(px+r,py)&&!tileSolid(px-r,py)&&!tileSolid(px,py+r)&&!tileSolid(px,py-r);
}
function los(x1,y1,x2,y2){
const d=dist(x1,y1,x2,y2),steps=Math.ceil(d/(TILE*.35));
for(let i=1;i<steps;i++){
const t=i/steps;
if(tileSolid(x1+(x2-x1)*t,y1+(y2-y1)*t))return false;
}
return true;
}

addEventListener('keydown',e=>{
keys[e.code]=true;
if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
});
addEventListener('keyup',e=>{keys[e.code]=false});

function showMsg(text,dur){
const m=document.getElementById('msg');
m.textContent=text;m.style.opacity=1;
clearTimeout(msgTO);
msgTO=setTimeout(()=>{m.style.opacity=0},dur*1000);
}

let actx=null,master=null,droneGain=null,stGain=null,noiseBuf=null;
function initAudio(){
if(actx)return;
actx=new (window.AudioContext||window.webkitAudioContext)();
master=actx.createGain();master.gain.value=.9;master.connect(actx.destination);
noiseBuf=actx.createBuffer(1,actx.sampleRate*2,actx.sampleRate);
const d=noiseBuf.getChannelData(0);
for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
const o1=actx.createOscillator(),o2=actx.createOscillator(),lp=actx.createBiquadFilter(),lfo=actx.createOscillator(),lfoG=actx.createGain();
o1.type='sawtooth';o1.frequency.value=38;o2.type='sawtooth';o2.frequency.value=57.3;
lp.type='lowpass';lp.frequency.value=110;lfo.frequency.value=.06;lfoG.gain.value=28;
lfo.connect(lfoG);lfoG.connect(lp.frequency);
droneGain=actx.createGain();droneGain.gain.value=.05;
o1.connect(lp);o2.connect(lp);lp.connect(droneGain);droneGain.connect(master);
o1.start();o2.start();lfo.start();
const nsrc=actx.createBufferSource();nsrc.buffer=noiseBuf;nsrc.loop=true;
const hp=actx.createBiquadFilter();hp.type='highpass';hp.frequency.value=1400;
stGain=actx.createGain();stGain.gain.value=0;
nsrc.connect(hp);hp.connect(stGain);stGain.connect(master);nsrc.start();
}
function setDrone(v){if(droneGain)droneGain.gain.linearRampToValueAtTime(v,actx.currentTime+.8)}
function thump(vol){
if(!actx)return;const t0=actx.currentTime;
[[0,vol],[0.16,vol*.65]].forEach(([dt,v])=>{
const o=actx.createOscillator(),g=actx.createGain();
o.type='sine';o.frequency.setValueAtTime(62,t0+dt);o.frequency.exponentialRampToValueAtTime(26,t0+dt+.13);
g.gain.setValueAtTime(.0001,t0+dt);g.gain.exponentialRampToValueAtTime(v,t0+dt+.015);g.gain.exponentialRampToValueAtTime(.0001,t0+dt+.17);
o.connect(g);g.connect(master);o.start(t0+dt);o.stop(t0+dt+.2);
});
}
function tap(){
if(!actx)return;const t0=actx.currentTime;
const s=actx.createBufferSource();s.buffer=noiseBuf;s.playbackRate.value=.8;
const f=actx.createBiquadFilter();f.type='lowpass';f.frequency.value=240;
const g=actx.createGain();g.gain.setValueAtTime(.09,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+.07);
s.connect(f);f.connect(g);g.connect(master);s.start(t0);s.stop(t0+.08);
}
function pickupSting(){
if(!actx)return;const t0=actx.currentTime;
[[520,170,.32,.2],[554,176,.3,.12],[1046,900,.14,.1]].forEach(([f1,f2,dur,v],i)=>{
const o=actx.createOscillator(),g=actx.createGain();o.type=i<2?'triangle':'sine';
o.frequency.setValueAtTime(f1,t0+i*.04);o.frequency.exponentialRampToValueAtTime(f2,t0+i*.04+dur);
g.gain.setValueAtTime(.0001,t0+i*.04);g.gain.exponentialRampToValueAtTime(v,t0+i*.04+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+i*.04+dur);
o.connect(g);g.connect(master);o.start(t0+i*.04);o.stop(t0+i*.04+dur+.05);
});
}
function scream(){
if(!actx)return;const t0=actx.currentTime;
const s=actx.createBufferSource();s.buffer=noiseBuf;
const bp=actx.createBiquadFilter();bp.type='bandpass';bp.Q.value=.8;
bp.frequency.setValueAtTime(2800,t0);bp.frequency.exponentialRampToValueAtTime(220,t0+1.1);
const g=actx.createGain();g.gain.setValueAtTime(.95,t0);g.gain.exponentialRampToValueAtTime(.001,t0+1.25);
s.connect(bp);bp.connect(g);g.connect(master);s.start(t0);s.stop(t0+1.3);
const sh=actx.createOscillator(),sg=actx.createGain();
sh.type='square';sh.frequency.setValueAtTime(900,t0);sh.frequency.exponentialRampToValueAtTime(120,t0+.5);
sg.gain.setValueAtTime(.4,t0);sg.gain.exponentialRampToValueAtTime(.001,t0+.6);
sh.connect(sg);sg.connect(master);sh.start(t0);sh.stop(t0+.65);
const sub=actx.createOscillator(),subg=actx.createGain();
sub.type='sine';sub.frequency.value=48;
subg.gain.setValueAtTime(.75,t0);subg.gain.exponentialRampToValueAtTime(.001,t0+1);
sub.connect(subg);subg.connect(master);sub.start(t0);sub.stop(t0+1.05);
}
function winChime(){
if(!actx)return;const t0=actx.currentTime;
[392,494,587,784].forEach((f,i)=>{
const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=f;
const st=t0+i*.14;
g.gain.setValueAtTime(.0001,st);g.gain.exponentialRampToValueAtTime(.16,st+.03);g.gain.exponentialRampToValueAtTime(.0001,st+.7);
o.connect(g);g.connect(master);o.start(st);o.stop(st+.75);
});
}

const noiseFrames=[];
(function(){
for(let k=0;k<3;k++){
const c=document.createElement('canvas');c.width=320;c.height=180;
const cx2=c.getContext('2d'),img=cx2.createImageData(320,180);
for(let i=0;i<img.data.length;i+=4){
const v=(Math.random()*255)|0;
img.data[i]=v;img.data[i+1]=v;img.data[i+2]=v;img.data[i+3]=(Math.random()*200)|0;
}
cx2.putImageData(img,0,0);noiseFrames.push(c);
}
})();

function die(reason){
dieReason=reason;state='jumpscare';jt=0;scream();
if(stGain)stGain.gain.value=0;
}
function winGame(){
state='won';winChime();setDrone(.015);
document.getElementById('endTitle').textContent='ESCAPASTE';
document.getElementById('endReason').innerHTML='La puerta se abrió… y afuera amanecía.<br><i>Esta vez.</i>';
document.getElementById('end').classList.remove('hidden');
document.getElementById('hud').classList.add('hidden');
}

function repositionGhost(){
const cand=[],noLos=[];
for(const c of floorCells){
const p0=cc(c),d=dist(p0.px,p0.py,player.x,player.y);
if(d>300&&d<720){
cand.push(p0);
if(!los(p0.px,p0.py,player.x,player.y))noLos.push(p0);
}
}
const pool=noLos.length?noLos:cand;
if(pool.length){const p0=pool[(Math.random()*pool.length)|0];ghost.x=p0.px;ghost.y=p0.py}
}

function update(dt){
let dx=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);
let dy=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);
const mag=Math.hypot(dx,dy);
player.moving=mag>0;
if(mag>0){dx/=mag;dy/=mag;player.fx=dx;player.fy=dy}
const wantRun=(keys.ShiftLeft||keys.ShiftRight)&&player.moving&&player.stam>0;
let spd=215;
if(wantRun){spd*=1.62;player.stam=Math.max(0,player.stam-28*dt)}
else player.stam=Math.min(100,player.stam+16*dt);
const nx=player.x+dx*spd*dt,ny=player.y+dy*spd*dt;
if(canBe(nx,player.y,player.r))player.x=nx;
if(canBe(player.x,ny,player.r))player.y=ny;
if(player.moving){
footT-=dt;
if(footT<=0){tap();footT=wantRun?.24:.36}
}
for(const p of pages){
if(!p.taken&&dist(player.x,player.y,p.x,p.y)<36){
p.taken=true;pagesGot++;pickupSting();
document.getElementById('pg').textContent=`Páginas ${pagesGot} / 8`;
if(pagesGot===1){ghost.active=true;showMsg('Algo ha despertado…',2.6)}
else if(pagesGot<8)showMsg(pagesGot<6?'La presencia se acerca…':'Ya casi. No te detengas.',2.2);
else{door.active=true;setDrone(.075);showMsg('¡LA PUERTA ESTÁ ABIERTA! ¡CORRE!',4)}
if(ghost.active){ghost.timer=Math.min(ghost.timer,2);repositionGhost()}
}
}
const gd=dist(player.x,player.y,ghost.x,ghost.y);
danger=clamp(1-gd/560,0,1);
if(ghost.active){
if(!ghost.chasing){
ghost.timer-=dt*(1+pagesGot*.12);
if(ghost.timer<=0){repositionGhost();ghost.timer=Math.max(3.5,rand2(tG,7)*6-pagesGot*.4)}
}
const sees=gd<TILE*8&&los(ghost.x,ghost.y,player.x,player.y);
if(sees&&!ghost.chasing){ghost.chasing=true;ghost.loseT=0}
if(ghost.chasing){
if(sees)ghost.loseT=0;else ghost.loseT+=dt;
if(ghost.loseT>2.5||gd>TILE*12)ghost.chasing=false;
const gspd=128+pagesGot*13;
const vx=player.x-ghost.x,vy=player.y-ghost.y,vd=Math.hypot(vx,vy)||1;
ghost.x+=vx/vd*gspd*dt;ghost.y+=vy/vd*gspd*dt;
}
if(gd<36){die('Te atrapó.');return}
const visible=gd<460&&los(ghost.x,ghost.y,player.x,player.y);
if(visible)stare=Math.min(1,stare+dt*(.3+danger*.2));
else stare=Math.max(0,stare-dt*.7);
if(stare>=1){die('No debiste sostener su mirada.');return}
hbT-=dt;
if(hbT<=0){thump(.14+danger*.34);hbT=1.15-danger*.68}
}
const stTarget=(ghost.active&&los(ghost.x,ghost.y,player.x,player.y)?danger*.28:0)+stare*.5;
staticA+=(clamp(stTarget,0,.85)-staticA)*Math.min(1,dt*6);
if(stGain)stGain.gain.value=staticA*.4;
if(door.active&&dist(player.x,player.y,door.x,door.y)<52)winGame();
}

let camX=0,camY=0,lightR=360;
function render(){
const shMag=danger*danger*10+(ghost.chasing?3:0);
camX=vw>=WORLD_W?(WORLD_W-vw)/2:clamp(player.x-vw/2,0,WORLD_W-vw);
camY=vh>=WORLD_H?(WORLD_H-vh)/2:clamp(player.y-vh/2,0,WORLD_H-vh);
const sx=camX+(Math.random()*2-1)*shMag,sy=camY+(Math.random()*2-1)*shMag;
ctx.setTransform(1,0,0,1,0,0);
ctx.fillStyle='#050308';ctx.fillRect(0,0,vw,vh);
ctx.save();ctx.translate(-sx,-sy);
const x0=Math.max(0,Math.floor(sx/TILE)),x1=Math.min(MW-1,Math.floor((sx+vw)/TILE));
const y0=Math.max(0,Math.floor(sy/TILE)),y1=Math.min(MH-1,Math.floor((sy+vh)/TILE));
ctx.fillStyle='#0d0a10';
ctx.fillRect(x0*TILE,y0*TILE,(x1-x0+1)*TILE,(y1-y0+1)*TILE);
for(let gy=y0;gy<=y1;gy++)for(let gx=x0;gx<=x1;gx++){
if(grid[gy][gx]===1){
const v=rand2(gx,gy)*.06;
const r=((30+v*255)|0),g=((23+v*255)|0),b=((29+v*255)|0);
ctx.fillStyle=`rgb(${r},${g},${b})`;
ctx.fillRect(gx*TILE,gy*TILE,TILE,TILE);
ctx.fillStyle='rgba(0,0,0,.35)';
if(rand2(gx*3,gy*5)>.5)ctx.fillRect(gx*TILE,gy*TILE,TILE,3);
else ctx.fillRect(gx*TILE,gy*TILE,3,TILE);
}else if(rand2(gx*7,gy*13)>.93){
ctx.fillStyle='rgba(0,0,0,.4)';
ctx.beginPath();ctx.arc((gx+.5)*TILE,(gy+.5)*TILE,14,0,7);ctx.fill();
}
}
if(door){
ctx.fillStyle='#241610';ctx.fillRect(door.x-22,door.y-30,44,60);
ctx.fillStyle='#150c07';ctx.fillRect(door.x-17,door.y-25,34,50);
ctx.fillStyle='#6b5626';ctx.beginPath();ctx.arc(door.x+10,door.y,3,0,7);ctx.fill();
}
for(const p of pages){
if(p.taken)continue;
const halo=ctx.createRadialGradient(p.x,p.y,2,p.x,p.y,30);
halo.addColorStop(0,'rgba(255,250,210,.18)');halo.addColorStop(1,'rgba(255,250,210,0)');
ctx.fillStyle=halo;ctx.fillRect(p.x-30,p.y-30,60,60);
ctx.save();ctx.translate(p.x,p.y);ctx.rotate((p.cx+p.cy)%2?.2:-.15);
ctx.fillStyle='#e8e4d8';ctx.fillRect(-8,-11,16,22);
ctx.strokeStyle='#8f887c';ctx.lineWidth=1;
for(let i=-6;i<=6;i+=4){ctx.beginPath();ctx.moveTo(-5,i);ctx.lineTo(5,i);ctx.stroke()}
ctx.restore();
}
if(ghost.active){
const sway=Math.sin(tG*3)*4;
ctx.save();ctx.translate(ghost.x,ghost.y+sway);
const bg=ctx.createLinearGradient(0,-52,0,46);
bg.addColorStop(0,'rgba(8,8,14,.96)');bg.addColorStop(1,'rgba(8,8,14,0)');
ctx.fillStyle=bg;
ctx.beginPath();ctx.moveTo(-16,-22);
ctx.quadraticCurveTo(-20,26,-9+sway,44);
ctx.lineTo(8-sway,44);
ctx.quadraticCurveTo(20,26,16,-22);
ctx.quadraticCurveTo(0,-54,-16,-22);
ctx.fill();
ctx.strokeStyle='rgba(6,6,10,.85)';ctx.lineWidth=5;
ctx.beginPath();ctx.moveTo(-13,-14);ctx.quadraticCurveTo(-24+sway,4,-19+sway*1.5,18);ctx.stroke();
ctx.beginPath();ctx.moveTo(13,-14);ctx.quadraticCurveTo(24-sway,4,19-sway*1.5,18);ctx.stroke();
ctx.restore();
}
ctx.restore();
const psx=player.x-sx,psy=player.y-sy;
lightR=360*(.94+.06*Math.sin(tG*13)+ (Math.random()-.5)*.05*(1+danger*2));
if(danger>.5&&Math.random()<.02)lightR*=.5;
const dk=ctx.createRadialGradient(psx,psy,lightR*.18,psx,psy,lightR);
dk.addColorStop(0,'rgba(0,0,0,0)');dk.addColorStop(.5,'rgba(0,0,0,.12)');
dk.addColorStop(.78,'rgba(0,0,0,.62)');dk.addColorStop(1,'rgba(0,0,0,.985)');
ctx.fillStyle=dk;ctx.fillRect(0,0,vw,vh);
const ang=Math.atan2(player.fy,player.fx);
ctx.globalCompositeOperation='lighter';
const wg=ctx.createRadialGradient(psx,psy,20,psx,psy,300);
wg.addColorStop(0,'rgba(255,235,190,.09)');wg.addColorStop(1,'rgba(255,235,190,0)');
ctx.fillStyle=wg;
ctx.beginPath();ctx.moveTo(psx,psy);ctx.arc(psx,psy,300,ang-.42,ang+.42);ctx.closePath();ctx.fill();
ctx.globalCompositeOperation='source-over';
if(ghost.active){
const gsx=ghost.x-sx,gsy=ghost.y-sy;
if(dist(ghost.x,ghost.y,player.x,player.y)<480&&rand2(Math.floor(tG*7),3)>.06){
ctx.save();ctx.shadowColor='#ff2222';ctx.shadowBlur=14;ctx.fillStyle='#ffdddd';
ctx.beginPath();ctx.arc(gsx-5.5,gsy-30+Math.sin(tG*3)*4,2.6,0,7);ctx.fill();
ctx.beginPath();ctx.arc(gsx+5.5,gsy-30+Math.sin(tG*3)*4,2.6,0,7);ctx.fill();
ctx.restore();
}
}
for(const p of pages){
if(p.taken)continue;
const px=p.x-sx,py=p.y-sy;
if(px<-20||py<-20||px>vw+20||py>vh+20)continue;
ctx.fillStyle=`rgba(255,255,225,${.25+.25*Math.sin(tG*4+p.cx)})`;
ctx.beginPath();ctx.arc(px,py,2,0,7);ctx.fill();
}
if(door&&door.active){
const dx2=door.x-sx,dy2=door.y-sy;
const pulse=.5+.5*Math.sin(tG*5);
const dg=ctx.createRadialGradient(dx2,dy2,4,dx2,dy2,80);
dg.addColorStop(0,`rgba(90,255,150,${.3*pulse})`);dg.addColorStop(1,'rgba(90,255,150,0)');
ctx.fillStyle=dg;ctx.fillRect(dx2-80,dy2-80,160,160);
ctx.strokeStyle=`rgba(130,255,175,${.5+.4*pulse})`;ctx.lineWidth=2;
ctx.strokeRect(dx2-22,dy2-30,44,60);
}
if(staticA>.01){
ctx.globalAlpha=staticA;
ctx.drawImage(noiseFrames[(Math.random()*3)|0],(Math.random()*40)|0,(Math.random()*40)|0,320-80,180-40,0,0,vw,vh);
ctx.globalAlpha=1;
}
const vg=ctx.createRadialGradient(vw/2,vh/2,Math.min(vw,vh)*.35,vw/2,vh/2,Math.max(vw,vh)*.72);
vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.55)');
ctx.fillStyle=vg;ctx.fillRect(0,0,vw,vh);
if(stare>.02){
ctx.fillStyle=`rgba(122,13,18,${stare*.38*(.6+.4*Math.sin(tG*11))})`;
ctx.fillRect(0,0,vw,vh);
}
ctx.fillStyle='#e8e4d8';
ctx.beginPath();ctx.arc(psx,psy,player.r,0,7);ctx.fill();
ctx.strokeStyle='#111';ctx.lineWidth=2;ctx.stroke();
ctx.fillStyle='#111';
ctx.beginPath();ctx.arc(psx+player.fx*6,psy+player.fy*6,4,0,7);ctx.fill();
}

function renderFace(t){
const p=clamp(t/1.35,0,1),cx2=vw/2,cy2=vh/2;
ctx.setTransform(1,0,0,1,0,0);
ctx.fillStyle='#000';ctx.fillRect(0,0,vw,vh);
const sc=1+p*.9,jit=()=>(Math.random()*2-1)*8*p;
ctx.save();
ctx.translate(cx2+jit(),cy2+jit());ctx.scale(sc,sc);ctx.translate(-cx2,-cy2);
const hg=ctx.createRadialGradient(cx2,cy2-40,30,cx2,cy2,260);
hg.addColorStop(0,'#ded5cb');hg.addColorStop(1,'#4c443e');
ctx.fillStyle=hg;
ctx.beginPath();ctx.ellipse(cx2,cy2,140,195,0,0,7);ctx.fill();
ctx.fillStyle='#0a0605';
ctx.beginPath();ctx.ellipse(cx2-55,cy2-45,34,42,0,0,7);ctx.fill();
ctx.beginPath();ctx.ellipse(cx2+55,cy2-45,34,42,0,0,7);ctx.fill();
ctx.fillStyle='#fff';
const wob=Math.sin(tG*23)*9*p;
ctx.beginPath();ctx.arc(cx2-55+wob,cy2-42,4.5,0,7);ctx.fill();
ctx.beginPath();ctx.arc(cx2+55-wob,cy2-42,4.5,0,7);ctx.fill();
ctx.fillStyle='#100808';
ctx.beginPath();ctx.ellipse(cx2-16,cy2+22,5,10,.2,0,7);ctx.fill();
ctx.beginPath();ctx.ellipse(cx2+16,cy2+22,5,10,-.2,0,7);ctx.fill();
ctx.fillStyle='#050202';
ctx.beginPath();ctx.ellipse(cx2,cy2+105,45,12+85*p,0,0,7);ctx.fill();
if(p>.3){
ctx.fillStyle='#cfc7ba';
for(let i=-2;i<=2;i++){
ctx.beginPath();
ctx.moveTo(cx2+i*17-6,cy2+105-(10+80*p)+2);
ctx.lineTo(cx2+i*17+6,cy2+105-(10+80*p)+2);
ctx.lineTo(cx2+i*17,cy2+105-(10+80*p)+16);
ctx.closePath();ctx.fill();
}
}
ctx.strokeStyle='#5e0a0a';ctx.lineWidth=6;
for(const exo of [-55,55]){
ctx.beginPath();ctx.moveTo(cx2+exo,cy2-10);
ctx.quadraticCurveTo(cx2+exo+Math.sin(tG*9)*6,cy2+50,cx2+exo+Math.sin(tG*7)*10,cy2+30+110*p);
ctx.stroke();
}
ctx.strokeStyle='rgba(90,10,10,.6)';ctx.lineWidth=2;
for(let i=0;i<7;i++){
ctx.beginPath();
const a=Math.random()*7,r1=Math.random()*120,r2=r1+40+Math.random()*90;
ctx.moveTo(cx2+Math.cos(a)*r1,cy2+Math.sin(a)*r1*.8);
ctx.lineTo(cx2+Math.cos(a)*r2,cy2+Math.sin(a)*r2*.8);
ctx.stroke();
}
ctx.restore();
if(Math.random()<p*.3){ctx.fillStyle='rgba(230,225,215,.5)';ctx.fillRect(0,0,vw,vh)}
ctx.globalAlpha=.3;
ctx.drawImage(noiseFrames[(Math.random()*3)|0],0,0,vw,vh);
ctx.globalAlpha=1;
}

function updHud(){
const s=document.getElementById('stam');
s.style.width=player.stam+'%';
s.style.background=player.stam>30?'#7fae6a':'#c0392b';
}

let tPrev=0;
function frame(ts){
requestAnimationFrame(frame);
const dt=Math.min((ts-tPrev)/1000||0,.05);tPrev=ts;tG+=dt;
if(state==='play'){update(dt);if(state==='play'||state==='jumpscare'){render();updHud()}}
else if(state==='jumpscare'){
jt+=dt;render();renderFace(jt);
if(jt>=1.35){
state='over';setDrone(.02);
document.getElementById('endTitle').textContent='HAS MUERTO';
document.getElementById('endReason').innerHTML=dieReason+'<br><i>Las páginas siguen ahí fuera… esperando.</i>';
document.getElementById('end').classList.remove('hidden');
document.getElementById('hud').classList.add('hidden');
}
}else if(stGain)stGain.gain.value=0;
}
requestAnimationFrame(frame);

document.getElementById('btnStart').addEventListener('click',()=>{
initAudio();if(actx.state==='suspended')actx.resume();
resetGame();
document.getElementById('menu').classList.add('hidden');
document.getElementById('hud').classList.remove('hidden');
state='play';
});
document.getElementById('btnRetry').addEventListener('click',()=>{
if(actx.state==='suspended')actx.resume();
setDrone(.05);resetGame();
document.getElementById('end').classList.add('hidden');
document.getElementById('hud').classList.remove('hidden');
state='play';
});
</script>
</body>
</html>
